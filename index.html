<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      Sarankumar S — Software Engineer | React Native · MERN Stack · Full-Stack
    </title>
    <meta
      name="description"
      content="Sarankumar S is a Software Engineer with 3+ years of experience building production-grade web and mobile applications. Specializes in React Native, MERN Stack, TypeScript, AWS, and real-time systems."
    />
    <meta
      name="keywords"
      content="Sarankumar S, Software Engineer, React Native Developer, MERN Stack, Full-Stack Developer, TypeScript, Node.js, MongoDB, AWS S3, Firebase, Redux Toolkit, RTK Query, Chennai"
    />
    <meta name="author" content="Sarankumar S" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sarankumar S — Software Engineer" />
    <meta
      property="og:description"
      content="Building scalable digital experiences with React Native, MERN Stack, and TypeScript."
    />
    <meta property="og:image" content="/favicon.svg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Sarankumar S — Software Engineer" />
    <meta
      name="twitter:description"
      content="Building scalable digital experiences with React Native, MERN Stack, and TypeScript."
    />

    <!-- Fonts: Inter + Geist Mono via Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        background: #0a0a0f;
        color: #f5f5f7;
        font-family:
          "Inter",
          system-ui,
          -apple-system,
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
      /* Prevent layout shift while fonts load */
      #root {
        min-height: 100vh;
      }
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 5px;
      }
      ::-webkit-scrollbar-track {
        background: #0a0a0f;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(139, 92, 246, 0.5);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(139, 92, 246, 0.8);
      }
      ::selection {
        background: rgba(139, 92, 246, 0.3);
        color: #f5f5f7;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
